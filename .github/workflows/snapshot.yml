name: Daily S&P 500 snapshot

on:
  schedule:
    # 22:00 UTC weekdays — ~2 hours after US market close.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the token to push the updated snapshot back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python deps
        run: |
          pip install -r backend/requirements.txt
          pip install lxml html5lib beautifulsoup4

      - name: Build snapshot
        run: python scripts/build_snapshot.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git commit -m "chore: update S&P 500 snapshot ($(date -u +%Y-%m-%d))"
          git push
